<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="45" fill="#ea580c" opacity="0.1"/>
  <circle cx="50" cy="50" r="35" fill="#ea580c" opacity="0.2"/>
  
  <!-- देवी दुर्गा का सरल प्रतीक -->
  <!-- मुख -->
  <circle cx="50" cy="40" r="12" fill="#ea580c" opacity="0.3"/>
  
  <!-- त्रिशूल -->
  <line x1="50" y1="15" x2="50" y2="52" stroke="#ea580c" stroke-width="3"/>
  <line x1="35" y1="25" x2="50" y2="35" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="65" y1="25" x2="50" y2="35" stroke="#ea580c" stroke-width="2.5"/>
  
  <!-- शेर -->
  <ellipse cx="50" cy="80" rx="15" ry="8" fill="#ea580c" opacity="0.3"/>
  <circle cx="45" cy="85" r="4" fill="#ea580c" opacity="0.2"/>
  <circle cx="55" cy="85" r="4" fill="#ea580c" opacity="0.2"/>
  
  <!-- प्रभा मंडल -->
  <circle cx="50" cy="40" r="22" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.4"/>
  
  <!-- शक्ति रेखाएँ -->
  <line x1="25" y1="30" x2="30" y2="35" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
  <line x1="75" y1="30" x2="70" y2="35" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
  <line x1="20" y1="50" x2="28" y2="50" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
  <line x1="80" y1="50" x2="72" y2="50" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
  
  <!-- देवनागरी अक्षर -->
  <text x="50" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ea580c" font-weight="bold">ॐ</text>
</svg>