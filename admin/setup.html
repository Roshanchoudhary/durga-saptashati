<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Setup | दुर्गा सप्तशती</title><link rel="stylesheet" href="/assets/style.css"></head><body><main class="wrap admin" style="max-width:560px"><div class="admin-card"><div class="eyebrow">FIRST ADMIN SETUP</div><h1>Admin बनाइए</h1><p class="notice">यह पेज केवल तब उपलब्ध है जब D1 में अभी कोई Admin नहीं है।</p><form id="setup"><input id="username" class="field" autocomplete="username" placeholder="Username" required><br><br><input id="email" class="field" type="email" autocomplete="email" placeholder="Email (optional)"><br><br><input id="password" class="field" type="password" autocomplete="new-password" minlength="10" placeholder="Password (कम से कम 10 अक्षर)" required><br><br><input id="confirm" class="field" type="password" autocomplete="new-password" placeholder="Confirm Password" required><br><br><button class="btn primary" type="submit">Admin बनाएं</button><p id="msg"></p></form></div><a href="/">← वेबसाइट पर जाएँ</a></main><script src="/admin/setup.js"></script></body></html>
