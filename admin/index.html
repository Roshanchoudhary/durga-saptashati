<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | दुर्गा सप्तशती</title><link rel="stylesheet" href="/assets/style.css"></head><body><main class="wrap admin"><div class="row"><a href="/">← वेबसाइट</a><a href="/admin/settings.html">⚙ Settings</a></div><h1>Admin Dashboard</h1><div class="admin-card"><h2>Chapter Editor</h2><p class="notice">यह editor Word-style formatting देता है। Sanskrit और Hindi को अलग-अलग format करके Save/Publish करें।</p><input id="id" class="field" placeholder="ID — Edit करते समय भरें"><br><br><div class="two"><input id="num" class="field" type="number" placeholder="अध्याय क्रमांक"><input id="title" class="field" placeholder="अध्याय का नाम"></div><br><input id="sub" class="field" placeholder="उपशीर्षक"><br><br><div class="two"><div><h3>संस्कृत पाठ</h3><div class="editor"><div class="toolbar" data-target="sanskrit"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough">S</button><button data-cmd="justifyLeft">≡</button><button data-cmd="justifyCenter">☰</button><button data-cmd="justifyRight">≡</button><button data-cmd="insertUnorderedList">• List</button><button data-cmd="insertOrderedList">1. List</button><button data-cmd="formatBlock" data-value="h2">H2</button><button data-cmd="undo">↶</button><button data-cmd="redo">↷</button><button data-cmd="removeFormat">Tx</button><select data-font="sanskrit"><option value="">Font</option><option value="serif">Serif</option><option value="sans-serif">Sans</option><option value="monospace">Mono</option></select><select data-size="sanskrit"><option value="">Size</option><option value="2">छोटा</option><option value="4">मध्यम</option><option value="6">बड़ा</option></select></div><div id="sanskrit" class="editable" contenteditable="true"></div></div></div><div><h3>हिन्दी अर्थ</h3><div class="editor"><div class="toolbar" data-target="hindi"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough">S</button><button data-cmd="justifyLeft">≡</button><button data-cmd="justifyCenter">☰</button><button data-cmd="justifyRight">≡</button><button data-cmd="insertUnorderedList">• List</button><button data-cmd="insertOrderedList">1. List</button><button data-cmd="formatBlock" data-value="h2">H2</button><button data-cmd="undo">↶</button><button data-cmd="redo">↷</button><button data-cmd="removeFormat">Tx</button><select data-font="hindi"><option value="">Font</option><option value="serif">Serif</option><option value="sans-serif">Sans</option><option value="monospace">Mono</option></select><select data-size="hindi"><option value="">Size</option><option value="2">छोटा</option><option value="4">मध्यम</option><option value="6">बड़ा</option></select></div><div id="hindi" class="editable" contenteditable="true"></div></div></div></div><br><input id="seoTitle" class="field" placeholder="SEO Title"><br><br><input id="seoDesc" class="field" placeholder="SEO Description"><br><br><div class="row"><button id="save" class="btn primary">💾 Save & Publish</button><button id="new">नया</button></div><p id="msg"></p></div><div class="admin-card"><h2>Published Chapters</h2><div id="items">लोड हो रहा है…</div></div></main><script src="/admin/admin.js"></script></body></html>
